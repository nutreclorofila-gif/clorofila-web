[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # frame-ancestors es la versión moderna de X-Frame-Options (el header viejo
    # queda arriba para navegadores antiguos). form-action impide que un script
    # inyectado mande un formulario a un servidor ajeno. img-src incluye
    # googletagmanager porque GA4 sirve algunos píxeles desde ese dominio.
    # Los dominios de Google van con comodín a propósito: GA4 no manda los datos
    # siempre al mismo host, elige un subdominio regional (region1, region2...)
    # según dónde esté el visitante. Con el host fijo, el diagnóstico de la
    # etiqueta marcaba «la configuración de seguridad está bloqueando la
    # medición». doubleclick y google.com son para las conversiones de Google Ads.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://connect.facebook.net https://tally.so; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://*.google-analytics.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.google.com.uy; connect-src 'self' https://*.google-analytics.com https://google-analytics.com https://*.analytics.google.com https://analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.google.com.uy https://pagead2.googlesyndication.com https://connect.facebook.net https://www.facebook.com; frame-src https://www.google.com https://*.g.doubleclick.net https://tally.so; frame-ancestors 'self'; form-action 'self' https://tally.so; manifest-src 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caché de un año para las fotos: si se reemplaza una, cambiale el nombre
# (ver los 301 de img-*-v2 más arriba). Pisarla deja la vieja en los navegadores.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS y JS con cache corta a proposito. Llevan ?v= en el HTML, pero ya nos
# paso una vez olvidar de subirlo y dejar a los visitantes con la version
# vieja durante meses. Son 21KB entre los dos: no vale el riesgo.
[[headers]]
  for = "/base.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[build]
  publish = "."
  # Regenera fechas, precios, cupos y estado desde data/ofertas.json.
  # Gracias a esto, editar ese archivo alcanza para actualizar la web.
  command = "node scripts/render-ofertas.js"

# Cada construcción cuesta 15 créditos y el plan trae pocos: al 7/9/2026
# quedaban 49, o sea tres publicaciones hasta que el período cierra el 15.
# Solo main construye. Si alguien sube una rama de trabajo o abre un pull
# request, Netlify cancela antes de empezar en vez de gastar una publicación
# en algo que nadie va a mirar. Para volver a tener vistas previas por rama,
# borrar estos dos bloques.
[context.branch-deploy]
  ignore = "/bin/true"

[context.deploy-preview]
  ignore = "/bin/true"
