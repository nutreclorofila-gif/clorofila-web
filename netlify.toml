  status = 301
  force  = true

[[redirects]]
  from = "/cena-y-taller-de-tapeo"
  to   = "/tapeo"
  status = 301
  force  = true

[[redirects]]
  from = "/recetas"
  to   = "/articulos"
  status = 301
  force  = true

[[redirects]]
  from = "/recetas.html"
  to   = "/articulos"
  status = 301
  force  = true

[[redirects]]
  from = "/el-curso"
  to   = "/curso"
  status = 301
  force  = true

[[redirects]]
  from = "/programa-del-curso"
  to   = "/programa"
  status = 301
  force  = true

# --- Un link corto para pedir la reseña ------------------------------------
# En el paquete local de Google el peso lo llevan las reseñas, y ahí Clorofila
# va 22 contra 132 de MDPAULA y 595 de La Obrería: por eso no aparece en
# "clases de cocina montevideo" aunque sí en "curso de cocina vegana".
# Esto es para mandar por WhatsApp después de una clase: cae directo en el
# formulario, sin buscar el negocio. El place id está verificado contra el
# perfil real (Clorofila, 4,9, Escuela de cocina).
[[redirects]]
  from = "/opinar"
  to   = "https://search.google.com/local/writereview?placeid=ChIJnT7pnSOBn5URX6ytzyd5nDM"
  status = 302
  force  = true

[[redirects]]
  from = "/resena"
  to   = "https://search.google.com/local/writereview?placeid=ChIJnT7pnSOBn5URX6ytzyd5nDM"
  status = 302
  force  = true

# --- Lo que no es el sitio: fuera del alcance del público ---------------------
# Netlify publica la raíz entera, así que las notas de trabajo, el código de los
# chequeos y la fuente de datos quedaban servidos igual que una página. Nada de
# eso tiene claves, pero tampoco tiene por qué leerse desde afuera, y Google lo
# indexa si lo encuentra. Se comprobó antes que ninguna página del sitio pide
# nada de estas carpetas: todo se inyecta en el build.
# Los .md van uno por uno a propósito: Netlify no acepta comodín de extensión en
# "from" -el * solo vale como splat de ruta- así que "/*.md" no bloqueaba nada.
# Salió de verificar en producción después del deploy, no del chequeo local.
[[redirects]]
  from = "/CLAUDE.md"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/GUIA-DE-TEXTO.md"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/README.md"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/docs/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/scripts/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/partials/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/data/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/package.json"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/package-lock.json"
  to   = "/404.html"
  status = 404
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # frame-ancestors es la versión moderna de X-Frame-Options (el header viejo
    # queda arriba para navegadores antiguos). form-action impide que un script
    # inyectado mande un formulario a un servidor ajeno. img-src incluye
    # googletagmanager porque GA4 sirve algunos píxeles desde ese dominio.
    # Los dominios de Google van con comodín a propósito: GA4 no manda los datos
    # siempre al mismo host, elige un subdominio regional (region1, region2...)
    # según dónde esté el visitante. Con el host fijo, el diagnóstico de la
    # etiqueta marcaba «la configuración de seguridad está bloqueando la
    # medición». doubleclick y google.com son para las conversiones de Google Ads.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://connect.facebook.net https://tally.so; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://*.google-analytics.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.google.com.uy; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://connect.facebook.net https://www.facebook.com; frame-src https://www.google.com https://*.g.doubleclick.net https://tally.so; frame-ancestors 'self'; form-action 'self' https://tally.so; manifest-src 'self'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS y JS con cache corta a proposito. Llevan ?v= en el HTML, pero ya nos
# paso una vez olvidar de subirlo y dejar a los visitantes con la version
# vieja durante meses. Son 21KB entre los dos: no vale el riesgo.
[[headers]]
  for = "/base.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[build]
  publish = "."
  # Regenera fechas, precios, cupos y estado desde data/ofertas.json.
  # Gracias a esto, editar ese archivo alcanza para actualizar la web.
  command = "node scripts/render-ofertas.js"
