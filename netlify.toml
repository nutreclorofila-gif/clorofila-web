  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/.htmlvalidate.json"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/.gitignore"
  to   = "/404.html"
  status = 404
  force  = true

