[[redirects]]
  from = "http://clorofila.uy/*"
  to   = "https://clorofila.uy/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.clorofila.uy/*"
  to   = "https://clorofila.uy/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.clorofila.uy/*"
  to   = "https://clorofila.uy/:splat"
  status = 301
  force  = true

# --- URL propia por propuesta: cada producto se puede linkear y medir por separado.
# Instagram manda a clorofila.uy/fermentacion y cae en el bloque exacto, no en la lista.
[[redirects]]
  from = "/fermentacion"
  to   = "/talleres#fermentacion"
  status = 301
  force  = true

[[redirects]]
  from = "/pan-sin-gluten"
  to   = "/talleres#pan-sin-gluten"
  status = 301
  force  = true

[[redirects]]
  from = "/pastas-sin-gluten"
  to   = "/pastas"
  status = 301
  force  = true

[[redirects]]
  from = "/alfajores"
  to   = "/talleres#alfajores"
  status = 301
  force  = true

[[redirects]]
  from = "/quesos-vegetales"
  to   = "/talleres#quesos-vegetales"
  status = 301
  force  = true

# El Domingo de Buncheo no tiene bloque propio en /talleres, así que estas dos
# caían en un ancla inexistente: el visitante aterrizaba arriba de todo sin
# entender por qué. Van a la página entera hasta que se publique.
[[redirects]]
  from = "/buncheo"
  to   = "/talleres"
  status = 301
  force  = true

[[redirects]]
  from = "/brunch"
  to   = "/talleres"
  status = 301
  force  = true

# Variantes que la gente escribe o que quedaron en flyers viejos.
[[redirects]]
