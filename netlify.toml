# --- Un link corto para pedir la reseña ------------------------------------
# En el paquete local de Google el peso lo llevan las reseñas, y ahí Clorofila
# va 22 contra 132 de MDPAULA y 595 de La Obrería: por eso no aparece en
# "clases de cocina montevideo" aunque sí en "curso de cocina vegana".
# Esto es para mandar por WhatsApp después de una clase: cae directo en el
# formulario, sin buscar el negocio. El place id está verificado contra el
# perfil real (Clorofila, 4,9, Escuela de cocina).
[[redirects]]
  from = "/opinar"
  to   = "https://search.google.com/local/writereview?placeid=ChIJnT7pnSOBn5URX6ytzyd5nDM"
  status = 302
  force  = true

[[redirects]]
  from = "/resena"
  to   = "https://search.google.com/local/writereview?placeid=ChIJnT7pnSOBn5URX6ytzyd5nDM"
  status = 302
  force  = true

# --- Lo que no es el sitio: fuera del alcance del público ---------------------
# Netlify publica la raíz entera, así que las notas de trabajo, el código de los
# chequeos y la fuente de datos quedaban servidos igual que una página. Nada de
# eso tiene claves, pero tampoco tiene por qué leerse desde afuera, y Google lo
# indexa si lo encuentra. Se comprobó antes que ninguna página del sitio pide
# nada de estas carpetas: todo se inyecta en el build.
# Los .md van uno por uno a propósito: Netlify no acepta comodín de extensión en
# "from" -el * solo vale como splat de ruta- así que "/*.md" no bloqueaba nada.
# Salió de verificar en producción después del deploy, no del chequeo local.
[[redirects]]
  from = "/CLAUDE.md"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/GUIA-DE-TEXTO.md"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/README.md"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/docs/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/scripts/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/partials/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/data/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/package.json"
  to   = "/404.html"
  status = 404
  force  = true

# La configuración de Lighthouse respondía 200 en clorofila.uy mientras
# package.json y CLAUDE.md daban 404. No tiene secretos, pero es config de
# build y no una página del sitio.
[[redirects]]
  from = "/lighthouserc.json"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from = "/package-lock.json"
  to   = "/404.html"
  status = 404
  force  = true

# Netlify publica la raíz del repo, así que todo lo versionado se sirve salvo
# que se corte acá. Faltaban cuatro: la configuración de permisos del proyecto
# —que cuenta qué comandos se pueden correr—, los dos workflows de CI y la
# config del validador. No hay credenciales en ninguno, pero no son parte del
# sitio y no tienen por qué leerse desde afuera.
[[redirects]]
  from = "/.claude/*"
  to   = "/404.html"
  status = 404
  force  = true

[[redirects]]
