[[redirects]]
  from = "http://clorofila.uy/*"
  to   = "https://clorofila.uy/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.clorofila.uy/*"
  to   = "https://clorofila.uy/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.clorofila.uy/*"
  to   = "https://clorofila.uy/:splat"
  status = 301
  force  = true

# --- URL propia por propuesta: cada producto se puede linkear y medir por separado.
# Instagram manda a clorofila.uy/fermentacion y cae en el bloque exacto, no en la lista.
[[redirects]]
  from = "/fermentacion"
  to   = "/talleres#fermentacion"
  status = 301
  force  = true

[[redirects]]
  from = "/pan-sin-gluten"
  to   = "/talleres#pan-sin-gluten"
  status = 301
  force  = true

[[redirects]]
  from = "/pastas-sin-gluten"
  to   = "/talleres#pastas-sin-gluten"
  status = 301
  force  = true

[[redirects]]
  from = "/alfajores"
  to   = "/talleres#alfajores"
  status = 301
  force  = true

[[redirects]]
  from = "/quesos-vegetales"
  to   = "/talleres#quesos-vegetales"
  status = 301
  force  = true

[[redirects]]
  from = "/buncheo"
  to   = "/talleres#buncheo"
  status = 301
  force  = true

[[redirects]]
  from = "/brunch"
  to   = "/talleres#buncheo"
  status = 301
  force  = true

# Variantes que la gente escribe o que quedaron en flyers viejos.
[[redirects]]
  from = "/cena-y-taller-de-tapeo"
  to   = "/tapeo"
  status = 301
  force  = true

[[redirects]]
  from = "/recetas"
  to   = "/articulos"
  status = 301
  force  = true

[[redirects]]
  from = "/recetas.html"
  to   = "/articulos"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://tally.so; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com; frame-src https://www.google.com https://tally.so; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/shared.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build]
  publish = "."
  # Regenera fechas, precios, cupos y estado desde data/ofertas.json.
  # Gracias a esto, editar ese archivo alcanza para actualizar la web.
  command = "node scripts/render-ofertas.js"
